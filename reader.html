<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Online Focus Group — Reader</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Poppins:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/reader.css">
</head>
<body class="reader-body">

  <header class="reader-topbar">
    <span class="reader-topbar__title" id="scriptTitle">—</span>
    <div class="reader-topbar__actions">
      <button class="lang-toggle lang-toggle--inline" id="langToggle" type="button">English</button>
    </div>
  </header>

  <main class="book-viewport">
    <button class="nav-btn nav-prev" id="prevBtn" type="button" aria-label="Previous page">
      <span class="nav-btn__arrow">‹</span>
    </button>

    <div class="book" id="book">
      <!-- Floating zoom controls over the book -->
      <div class="zoom-controls">
        <button class="icon-btn cinematic-btn" id="zoomOutBtn" type="button">A-</button>
        <button class="icon-btn cinematic-btn" id="zoomInBtn" type="button">A+</button>
      </div>
      <div class="loading-indicator" id="loadingIndicator">جاري تحميل النص...</div>
      <div class="page" id="pageCurrent" hidden>
        <div class="page-inner" id="pageContent"></div>
        <div class="watermark" id="watermark"></div>
      </div>
    </div>

    <button class="nav-btn nav-next" id="nextBtn" type="button" aria-label="Next page">
      <span class="nav-btn__arrow">›</span>
    </button>
  <div class="page-notes">
      <button class="notes-toggle-btn" id="notesToggleBtn" type="button">
        <span class="notes-icon">📝</span>
        <span data-i18n="addNoteBtn">أضف ملاحظة</span>
      </button>
      <div class="page-notes-content" id="pageNotesContent">
        <label id="notesLabel" for="pageNote" data-i18n="notesLabel">ملاحظات هذه الصفحة (اختياري)</label>
        <textarea id="pageNote" rows="2" data-i18n-placeholder="notesPlaceholder" placeholder="اكتب أفكارك هنا لكي لا تنساها..."></textarea>
      </div>
    </div>
  </main>

  <footer class="reader-footer">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="page-indicator" id="pageIndicator">— / —</div>
  </footer>

  <!-- Custom Exit Modal -->
  <div class="exit-modal-overlay" id="exitModal">
    <div class="exit-modal-box">
      <h3 data-i18n="modalTitle">تأكيد الإنهاء</h3>
      <p data-i18n="modalText">هل أنت متأكد أنك انتهيت من القراءة؟ لا يمكنك العودة إلى النص بمجرد الانتقال إلى صفحة التقييم.</p>
      <div class="modal-actions">
        <button class="modal-btn cancel-btn" id="cancelExitBtn" type="button" data-i18n="modalCancel">إلغاء</button>
        <button class="modal-btn confirm-btn" id="confirmExitBtn" type="button" data-i18n="modalConfirm">نعم، انتهيت</button>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/reader.js"></script>
</body>
</html>
