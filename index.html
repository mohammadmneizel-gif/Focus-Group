<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Online Focus Group</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/forms.css">
</head>
<body class="bg-index">

  <button class="lang-toggle" id="langToggle" type="button">English</button>

  <main class="card">
    <!-- Golden Group Icon -->
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 20px; display: block;">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
      <circle cx="9" cy="7" r="4"></circle>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
    </svg>
    <h1 class="card__title" data-i18n="title">مرحباً بك</h1>
    <p class="card__subtitle" data-i18n="subtitle">يرجى إدخال بياناتك للمتابعة</p>

    <form id="entryForm" novalidate>
      <div class="field" id="nameField">
        <label for="fullName" data-i18n="nameLabel">الاسم الكامل</label>
        <input type="text" id="fullName" name="fullName" autocomplete="name" data-i18n-placeholder="namePlaceholder">
        <div class="field-error" data-i18n="nameError">يرجى إدخال الاسم الكامل</div>
      </div>

      <div class="field" id="phoneField">
        <label for="phoneNumber" data-i18n="phoneLabel">رقم الهاتف</label>
        <input type="tel" id="phoneNumber" name="phoneNumber" autocomplete="tel" data-i18n-placeholder="phonePlaceholder">
        <div class="field-error" data-i18n="phoneError">يرجى إدخال رقم هاتف صحيح</div>
      </div>

      <button type="submit" class="btn-primary" data-i18n="submitBtn">متابعة</button>
    </form>

    <div class="card__footnote" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
      <!-- Golden Lock Icon -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span data-i18n="footnote">محتوى هذه الصفحة سري ومخصص للمشاركين المدعوين فقط</span>
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/entry.js"></script>
</body>
</html>
